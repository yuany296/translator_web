<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>漫画翻译器</title>
  <link rel="stylesheet" href="quick-popup.css" />
</head>
<body>
  <header class="popup-header">
    <div>
      <p class="eyebrow">MANGA TRANSLATOR</p>
      <h1>漫画翻译器</h1>
    </div>
    <label class="master-switch" title="启用或停用扩展">
      <input id="runtimeEnabled" type="checkbox" />
      <span aria-hidden="true"></span>
      <b>启用</b>
    </label>
  </header>
  <main>
    <section class="card" aria-labelledby="languageHeading">
      <div class="section-heading">
        <div><h2 id="languageHeading">翻译语言</h2><p>漫画 OCR、小说和网页共用</p></div>
        <span id="saveIndicator" class="save-indicator" aria-live="polite"></span>
      </div>
      <div class="language-grid">
        <label for="sourceLanguage">原文语言
          <select id="sourceLanguage">
            <option value="auto">自动识别</option><option value="ja">日语</option>
            <option value="ko">韩语</option><option value="en">英语</option>
            <option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文</option>
          </select>
        </label>
        <label for="targetLanguage">目标语言
          <select id="targetLanguage">
            <option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文</option>
            <option value="en">英语</option><option value="ja">日语</option><option value="ko">韩语</option>
          </select>
        </label>
      </div>
    </section>
    <section class="card display-card" aria-labelledby="displayHeading">
      <h2 id="displayHeading">显示内容</h2>
      <fieldset class="segmented">
        <legend class="sr-only">显示内容</legend>
        <label><input type="radio" name="displayMode" value="translated" /><span>仅译文</span></label>
        <label><input type="radio" name="displayMode" value="bilingual" /><span>双语</span></label>
      </fieldset>
    </section>
    <button id="translateBtn" class="translate-button" type="button">
      <span class="translate-icon" aria-hidden="true">译</span>
      <span><b>翻译当前可视区</b><small>识别并翻译当前看到的漫画内容</small></span>
    </button>
    <div id="globalStatus" class="status" role="status" aria-live="polite"></div>
  </main>
  <footer>
    <span>服务、术语库与高级选项</span>
    <button id="settingsBtn" type="button">完整设置 <span aria-hidden="true">›</span></button>
  </footer>
  <script src="quick-popup.js"></script>
</body>
</html>
