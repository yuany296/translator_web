<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>漫画翻译术语库</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, "Microsoft YaHei", system-ui, sans-serif;
        color: #172033;
        background: #f4f7fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 720px;
      }

      main {
        width: min(1120px, calc(100% - 40px));
        margin: 32px auto 48px;
      }

      .page-header,
      .toolbar,
      .summary,
      .dialog-actions,
      .row-actions {
        display: flex;
        align-items: center;
      }

      .page-header {
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 20px;
      }

      h1,
      h2,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 8px;
        font-size: 28px;
      }

      .subtitle,
      .summary,
      .empty-state {
        color: #64748b;
      }

      .panel {
        overflow: hidden;
        border: 1px solid #dce4ef;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.06);
      }

      .toolbar {
        flex-wrap: wrap;
        gap: 10px;
        padding: 16px;
        border-bottom: 1px solid #e5eaf1;
      }

      .search {
        flex: 1 1 280px;
        min-width: 220px;
      }

      input[type="search"],
      input[type="text"],
      textarea {
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: 9px;
        padding: 9px 11px;
        font: inherit;
        background: #ffffff;
      }

      textarea {
        min-height: 88px;
        resize: vertical;
      }

      input:focus,
      textarea:focus {
        border-color: #2563eb;
        outline: 3px solid rgba(37, 99, 235, 0.12);
      }

      button {
        border: 1px solid #cbd5e1;
        border-radius: 9px;
        padding: 9px 13px;
        font: inherit;
        color: #263247;
        background: #ffffff;
        cursor: pointer;
      }

      button:hover {
        background: #f8fafc;
      }

      .primary {
        border-color: #2563eb;
        color: #ffffff;
        background: #2563eb;
      }

      .primary:hover {
        background: #1d4ed8;
      }

      .danger {
        color: #b42318;
      }

      .summary {
        justify-content: space-between;
        min-height: 44px;
        gap: 16px;
        padding: 10px 16px;
        border-bottom: 1px solid #e5eaf1;
        font-size: 13px;
      }

      #statusText[data-error="true"] {
        color: #b42318;
      }

      #statusText[data-error="false"] {
        color: #047857;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }

      th,
      td {
        padding: 13px 12px;
        border-bottom: 1px solid #edf1f6;
        text-align: left;
        vertical-align: top;
        overflow-wrap: anywhere;
      }

      th {
        color: #475569;
        font-size: 12px;
        font-weight: 600;
        background: #f8fafc;
      }

      th:first-child,
      td:first-child {
        width: 74px;
        text-align: center;
      }

      th:nth-child(2),
      th:nth-child(3) {
        width: 24%;
      }

      th:last-child,
      td:last-child {
        width: 132px;
      }

      td.note {
        color: #64748b;
      }

      .row-actions {
        gap: 6px;
      }

      .row-actions button {
        padding: 5px 9px;
        font-size: 12px;
      }

      .empty-state {
        padding: 56px 20px;
        text-align: center;
      }

      dialog {
        width: min(560px, calc(100% - 40px));
        border: 0;
        border-radius: 16px;
        padding: 0;
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.28);
      }

      dialog::backdrop {
        background: rgba(15, 23, 42, 0.45);
      }

      .dialog-content {
        padding: 22px;
      }

      .field {
        margin-bottom: 15px;
      }

      label {
        display: block;
        margin-bottom: 6px;
        color: #334155;
        font-size: 13px;
        font-weight: 600;
      }

      .enabled-field {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .enabled-field label {
        margin: 0;
        font-weight: 400;
      }

      .dialog-actions {
        justify-content: flex-end;
        gap: 8px;
        margin-top: 20px;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <header class="page-header">
        <div>
          <h1>术语库</h1>
          <p class="subtitle">统一角色名、地名和专有词译法；已启用术语会应用到所有网站。</p>
        </div>
        <button id="addBtn" class="primary" type="button">新增术语</button>
      </header>

      <section class="panel">
        <div class="toolbar">
          <input id="searchInput" class="search" type="search" placeholder="搜索原文、译文或备注" />
          <button id="importBtn" type="button">导入 JSON/CSV</button>
          <button id="exportJsonBtn" type="button">导出 JSON</button>
          <button id="exportCsvBtn" type="button">导出 CSV</button>
          <button id="clearBtn" class="danger" type="button">清空全部</button>
          <input id="fileInput" class="hidden" type="file" accept=".json,.csv,application/json,text/csv" />
        </div>

        <div class="summary">
          <span id="countText">正在读取术语...</span>
          <span id="statusText" aria-live="polite"></span>
        </div>

        <div id="tableContainer">
          <table>
            <thead>
              <tr>
                <th>启用</th>
                <th>原文术语</th>
                <th>固定译文</th>
                <th>备注</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="termRows"></tbody>
          </table>
          <div id="emptyState" class="empty-state hidden">暂无术语，点击“新增术语”开始建立词库。</div>
        </div>
      </section>
    </main>

    <dialog id="termDialog">
      <form id="termForm" class="dialog-content">
        <h2 id="dialogTitle">新增术语</h2>
        <input id="termIdInput" type="hidden" />
        <div class="field">
          <label for="sourceInput">原文术语</label>
          <input id="sourceInput" type="text" maxlength="120" required />
        </div>
        <div class="field">
          <label for="targetInput">固定译文</label>
          <input id="targetInput" type="text" maxlength="120" required />
        </div>
        <div class="field">
          <label for="noteInput">备注（可选，会作为翻译上下文）</label>
          <textarea id="noteInput" maxlength="240"></textarea>
        </div>
        <div class="enabled-field">
          <input id="enabledInput" type="checkbox" checked />
          <label for="enabledInput">立即启用</label>
        </div>
        <div class="dialog-actions">
          <button id="cancelBtn" type="button">取消</button>
          <button class="primary" type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <script src="glossary-core.js"></script>
    <script src="glossary.js"></script>
  </body>
</html>
