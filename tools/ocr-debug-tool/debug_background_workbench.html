<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Background Classifier Compare</title>
  <style>
    :root { color-scheme:light; --bg:#f3f5f7; --panel:#fff; --line:#d9dee5; --text:#172033; --muted:#667386; --blue:#1769e0; --green:#087f5b; --red:#c92a2a; --amber:#b26a00; --purple:#7c3aed; }
    * { box-sizing:border-box } body { margin:0;font-family:"Segoe UI","Microsoft YaHei UI",Arial,sans-serif;color:var(--text);background:var(--bg) }
    button,input,select { border:1px solid var(--line);border-radius:6px;padding:7px 9px;font:inherit;background:#fff } button { cursor:pointer;font-weight:700 } button:disabled { opacity:.5;cursor:wait }.compact-select { width:82px;height:35px;padding:5px;font-size:11px }
    .primary { color:#fff;border-color:var(--blue);background:var(--blue) }.secondary { background:#eef2f6 }.danger { color:var(--red) }
    .topbar { position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line);background:rgba(255,255,255,.98) }.top-main { display:flex;align-items:center;gap:8px;padding:12px 16px }.brand { margin-right:8px }.brand h1 { margin:0;font-size:18px }.brand small,.muted { color:var(--muted);font-size:11px }
    .file-button { position:relative;display:inline-flex;align-items:center;justify-content:center;height:35px;border:1px solid var(--line);border-radius:6px;padding:0 11px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;background:#fff;overflow:hidden }.file-button input { position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;opacity:0;cursor:pointer }.grow { flex:1 }.service { width:210px }.status { color:var(--muted);font-size:12px;white-space:nowrap }.status.bad { color:var(--red) }
    .parameter-bar { display:flex;align-items:stretch;gap:8px;padding:0 16px 12px;overflow-x:auto }.parameter-groups { display:flex;gap:8px }.parameter-group { flex:0 0 475px;border:1px solid var(--line);border-radius:6px;padding:7px;background:#f8fafc }.parameter-group.enabled { border-color:var(--blue);background:#edf5ff }.parameter-head { display:flex;align-items:center;gap:7px;margin-bottom:6px }.parameter-head strong { margin-right:auto;font-size:12px }.parameter-head input[type=checkbox] { width:15px;height:15px;margin:0 }.parameter-head button { padding:3px 7px;font-size:11px }
    .parameter-fields { display:grid;grid-template-columns:repeat(5,minmax(78px,1fr));gap:5px }.parameter-field { display:grid;gap:2px;color:var(--muted);font-size:9px }.parameter-field input { min-width:0;width:100%;padding:4px;font-size:11px }.parameter-field.toggle { display:flex;align-items:center;gap:4px }.add-group { flex:0 0 38px;color:var(--blue);font-size:22px }
    .file-strip { display:flex;gap:8px;min-height:88px;padding:10px 16px;overflow-x:auto;border-bottom:1px solid var(--line);background:#e9edf1 }.file-item { display:grid;grid-template-columns:60px 125px;gap:7px;flex:0 0 202px;border:1px solid var(--line);border-radius:6px;padding:4px;background:#fff;text-align:left }.file-item.active { border:2px solid var(--blue);padding:3px }.file-item img { width:60px;height:60px;object-fit:cover }.file-item strong { display:block;overflow:hidden;font-size:11px;text-overflow:ellipsis;white-space:nowrap }
    main { padding:12px 16px 20px }.toolbar { display:flex;align-items:center;gap:7px;margin-bottom:10px;flex-wrap:wrap }.toolbar h2 { margin:0 auto 0 0;font-size:14px }.filter.active { color:#fff;border-color:var(--blue);background:var(--blue) }
    .comparison-grid { display:grid;gap:10px;overflow-x:auto }.result-card { min-width:290px;border:1px solid var(--line);border-radius:6px;background:#fff;overflow:hidden }.result-card.active { border:2px solid var(--blue) }.result-head { display:flex;align-items:start;gap:7px;padding:9px;border-bottom:1px solid var(--line) }.result-head div { margin-right:auto }.result-head strong { display:block;font-size:13px }.result-head small { color:var(--muted);font-size:10px }.metrics { display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line) }.metrics span { padding:6px 3px;color:var(--muted);font-size:9px;text-align:center }.metrics b { display:block;color:var(--text);font-size:14px }
    .canvas-shell { display:grid;place-items:center;height:min(43vh,430px);min-height:250px;overflow:auto;padding:8px;background:#f7f8fa }.canvas-shell canvas { display:block;max-width:100%;max-height:100%;border:1px solid var(--line);background:#fff }.legend { padding:6px 9px;color:var(--muted);font-size:10px }.dot { display:inline-block;width:9px;height:9px;margin:0 3px 0 8px;border-radius:2px }
    .lower { display:grid;grid-template-columns:minmax(520px,1.3fr) minmax(360px,.7fr);gap:10px;margin-top:12px }.panel { border:1px solid var(--line);border-radius:6px;background:#fff;padding:11px }.panel h2 { margin:0 0 9px;font-size:14px }.preview-grid { display:grid;grid-template-columns:repeat(3,1fr);gap:7px }.preview { min-width:0 }.preview b { display:block;margin-bottom:3px;font-size:10px }.preview img { width:100%;height:145px;border:1px solid var(--line);object-fit:contain;background:#eef1f4 }.swatch { display:inline-block;width:22px;height:13px;border:1px solid #999;vertical-align:middle }
    table { width:100%;border-collapse:collapse;font-size:11px } th,td { border-bottom:1px solid var(--line);padding:5px;text-align:left } tr.fail { color:var(--red) } tr.pass { color:var(--green) }
    .mismatch-list { display:grid;gap:6px;max-height:360px;overflow:auto }.mismatch { display:grid;grid-template-columns:68px 1fr;gap:7px;border:1px solid var(--line);border-radius:5px;padding:5px;text-align:left;background:#fff }.mismatch img { width:68px;height:54px;object-fit:contain;background:#eee }.mismatch strong,.mismatch small { display:block }.mismatch small { color:var(--muted);font-size:9px }
    details { margin-top:12px;border:1px solid var(--line);border-radius:6px;background:#fff } summary { cursor:pointer;padding:9px 11px;font-weight:700;font-size:12px }.advanced { display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 11px 11px }.advanced pre { max-height:310px;overflow:auto;margin:0;padding:9px;background:#111827;color:#dbeafe;font-size:10px }.history { max-height:310px;overflow:auto;font-size:11px }
    .empty { padding:28px;color:var(--muted);text-align:center }.drop { position:fixed;inset:0;z-index:99;display:none;place-items:center;background:rgba(243,245,247,.9);pointer-events:none }.dragging .drop { display:grid }.drop strong { border:2px dashed var(--blue);padding:24px;background:#fff;color:var(--blue) }
    @media(max-width:1050px){.lower{grid-template-columns:1fr}.top-main{flex-wrap:wrap}.service{width:180px}}
  </style>
</head>
<body>
  <div class="drop"><strong>拖入漫画图片</strong></div>
  <header class="topbar">
    <div class="top-main">
      <div class="brand"><h1>Background Classifier Compare</h1><small>Local background parameter workbench</small></div>
      <label class="file-button">Add images<input id="imageInput" type="file" aria-label="Add images" accept="image/*,.png,.jpg,.jpeg,.webp,.bmp,.gif" multiple /></label>
      <label class="file-button">Add folder<input id="folderInput" type="file" aria-label="Add folder" accept="image/*,.png,.jpg,.jpeg,.webp,.bmp,.gif" multiple webkitdirectory /></label>
      <label class="file-button">Add OCR JSON<input id="ocrInput" type="file" aria-label="Add OCR JSON" accept="application/json,.json" /></label>
      <label class="file-button">Add labels.json<input id="labelsInput" type="file" aria-label="Add labels.json" accept="application/json,.json" /></label>
      <input id="serviceUrl" class="service" value="http://127.0.0.1:8765" title="本地 OCR 服务地址" />
      <select id="ocrLang" class="compact-select" title="自动 OCR 语言"><option value="auto">Auto</option><option value="japan">Japanese</option><option value="korean">Korean</option></select>
      <select id="ocrMode" class="compact-select" title="自动 OCR 模式"><option value="fast">Fast OCR</option><option value="enhanced">Enhanced</option></select>
      <button id="runPending" class="primary">Run pending</button><button id="runAll" class="secondary">Run all</button>
      <span id="status" class="status">加载图片即可；OCR JSON 为可选输入</span>
    </div>
    <div class="parameter-bar"><strong>参数组</strong><div id="parameterGroups" class="parameter-groups"></div><button id="addGroup" class="add-group" title="复制最后一组">+</button></div>
  </header>
  <section id="fileStrip" class="file-strip"><div class="empty">尚未加载图片</div></section>
  <main>
    <div class="toolbar"><h2 id="workspaceTitle">背景判定结果</h2><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="solid">只看 solid</button><button class="filter" data-filter="complex">只看 complex</button><button class="filter" data-filter="mismatch">只看误判</button><button class="filter" data-filter="falseComplex">应为色块但判复杂</button><button class="filter" data-filter="boundary">边界案例</button></div>
    <section id="comparisonGrid" class="comparison-grid"><div class="empty">运行参数组后在这里横向比较结果</div></section>
    <section class="lower">
      <article class="panel"><h2>选中框详情</h2><div id="detail" class="empty">点击任一结果画布中的 OCR 框</div></article>
      <article class="panel"><h2>应该使用色块但被判为复杂背景</h2><div id="mismatchList" class="mismatch-list"><div class="empty">暂无带 solid 标签的误判样本</div></div></article>
    </section>
    <details><summary>History、JSON 与导出</summary><div class="advanced"><div><div class="toolbar"><button id="exportJson">Export active JSON</button><button id="exportPng">Export active PNG</button><button id="exportDecisions">decisions.json</button><button id="exportFalse">false_complex_cases.json</button><button id="copyParams">Copy best params</button><button id="copyMismatch">Copy mismatch summary</button></div><pre id="jsonView">{}</pre></div><div><div id="history" class="history muted">暂无运行历史</div></div></div></details>
  </main>
  <script>
  (() => {
    "use strict";
    const STORAGE_KEY="background-debug-groups-v1";
    const PARAMS=[
      ["near_expand_ratio","near expand","近采样区相对 OCR 框的扩张比例"],["far_expand_ratio","far expand","远采样区相对 OCR 框的扩张比例"],
      ["lab_var_threshold","Lab variance","颜色方差上限；调高会让更多纹理通过"],["delta_e_threshold","Delta E","颜色距离上限；调高会放宽颜色差异"],
      ["dominant_ratio_threshold","dominant ratio","主色覆盖率下限；调低会让更多区域判为纯色"],["min_sample_pixels","min pixels","去除文字后要求的最少采样像素"],
      ["max_fill_area_ratio","max fill ratio","覆盖矩形与 OCR 框面积比上限"],["text_mask_dilate","mask dilate","文字遮罩向外膨胀的像素数"],
      ["ignore_text_mask","ignore mask","忽略文字遮罩并把文字像素纳入采样","bool"],["near_priority","near priority","近区通过时允许忽略远区的方差、P90 与主色失败","bool"]
    ];
    const BASE={near_expand_ratio:.35,far_expand_ratio:1.2,lab_var_threshold:12,delta_e_threshold:6,dominant_ratio_threshold:.85,min_sample_pixels:80,max_fill_area_ratio:2,text_mask_dilate:2,ignore_text_mask:false,near_priority:false};
    const DEFAULTS=[BASE,{...BASE,lab_var_threshold:18,delta_e_threshold:9,dominant_ratio_threshold:.78},{...BASE,lab_var_threshold:26,delta_e_threshold:14,dominant_ratio_threshold:.68},{...BASE,lab_var_threshold:18,delta_e_threshold:9,dominant_ratio_threshold:.78,near_priority:true}];
    const $=id=>document.getElementById(id); const uid=()=>crypto.randomUUID?.()||`g-${Date.now()}-${Math.random()}`;
    const state={files:[],current:0,groups:loadGroups(),results:new Map(),activeGroup:"",selectedBox:"",filter:"all",running:false,history:[],ocr:null,labels:{}};
    function loadGroups(){try{const v=JSON.parse(localStorage.getItem(STORAGE_KEY));if(Array.isArray(v)&&v.length)return v}catch{}return DEFAULTS.map(p=>({id:uid(),enabled:true,params:{...p}}))}
    function saveGroups(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state.groups))}
    function renderGroups(){const root=$("parameterGroups");root.innerHTML="";state.groups.forEach((group,index)=>{const card=document.createElement("section");card.className=`parameter-group${group.enabled?" enabled":""}`;const head=document.createElement("div");head.className="parameter-head";const on=document.createElement("input");on.type="checkbox";on.checked=group.enabled;on.onchange=()=>{group.enabled=on.checked;invalidate(group.id);saveGroups();renderGroups();renderResults()};const title=document.createElement("strong");title.textContent=`#${index+1}${group.params.near_priority?" · 近区优先":""}`;const rerun=document.createElement("button");rerun.textContent="↻ rerun";rerun.onclick=()=>run([group],true);const del=document.createElement("button");del.textContent="×";del.className="danger";del.onclick=()=>removeGroup(group.id);head.append(on,title,rerun,del);const fields=document.createElement("div");fields.className="parameter-fields";PARAMS.forEach(([name,label,tip,type])=>{const wrap=document.createElement("label");wrap.className=`parameter-field${type==="bool"?" toggle":""}`;wrap.title=tip;const caption=document.createElement("span");caption.textContent=label;if(type==="bool"){const input=document.createElement("input");input.type="checkbox";input.checked=!!group.params[name];input.onchange=()=>changeParam(group,name,input.checked);wrap.append(input,caption)}else{const input=document.createElement("input");input.type="number";input.step=["min_sample_pixels","text_mask_dilate"].includes(name)?"1":"any";input.value=group.params[name];input.onchange=()=>changeParam(group,name,Number(input.value));wrap.append(caption,input)}fields.append(wrap)});card.append(head,fields);root.append(card)})}
    function changeParam(group,name,value){group.params[name]=value;invalidate(group.id);saveGroups();renderGroups();renderResults()}
    function removeGroup(id){if(state.groups.length===1)return setStatus("至少保留一个参数组",true);state.groups=state.groups.filter(g=>g.id!==id);invalidate(id);saveGroups();renderGroups();renderResults()}
    function invalidate(id){for(const entries of state.results.values())entries.delete(id);if(state.activeGroup===id)state.activeGroup=""}
    function addGroup(){const last=state.groups.at(-1);state.groups.push({id:uid(),enabled:true,params:{...(last?.params||BASE)}});saveGroups();renderGroups()}
    function fileKey(file){return `${file.name}:${file.size}:${file.lastModified}`}
    function isImageFile(file){return String(file.type||"").startsWith("image/")||/\.(png|jpe?g|webp|bmp|gif)$/i.test(String(file.name||""))}
    async function loadImages(files){const selected=Array.from(files||[]);let added=0;const failures=[];for(const file of selected){if(!isImageFile(file)){failures.push(`${file.name}：不是支持的图片格式`);continue}const key=fileKey(file);if(state.files.some(x=>x.key===key))continue;const url=URL.createObjectURL(file);try{const image=await imageFrom(url);state.files.push({file,key,url,image,ocr:null,ocrSource:"",labels:{}});added+=1}catch{URL.revokeObjectURL(url);failures.push(`${file.name}：浏览器无法解码`)}}renderFiles();renderResults();if(added)setStatus(`已加入 ${added} 张图片；可直接运行，缺少 OCR 框时会自动识别`);else if(failures.length)setStatus(failures.join("；"),true);else if(selected.length)setStatus("所选图片已经在列表中",true);else setStatus("没有选择图片",true)}
    function renderFiles(){const root=$("fileStrip");root.innerHTML="";if(!state.files.length){root.innerHTML='<div class="empty">尚未加载图片</div>';return}state.files.forEach((item,index)=>{const b=document.createElement("button");b.className=`file-item${index===state.current?" active":""}`;const img=document.createElement("img");img.src=item.url;const meta=document.createElement("div");const strong=document.createElement("strong");strong.textContent=item.file.name;const small=document.createElement("small");small.className="muted";const count=item.ocr?.length||state.ocr?.length||0;small.textContent=count?`${count} boxes · ${item.ocrSource||"JSON"}`:"运行时自动 OCR";meta.append(strong,small);b.append(img,meta);b.onclick=()=>{state.current=index;state.selectedBox="";renderFiles();renderResults()};root.append(b)})}
    async function loadJson(file,kind){try{const value=JSON.parse(await file.text());if(kind==="ocr"){if(!Array.isArray(value))throw Error("OCR JSON 顶层必须是数组");state.ocr=value;if(currentFile()){currentFile().ocr=value;currentFile().ocrSource="JSON"}}else{if(!value||Array.isArray(value)||typeof value!=="object")throw Error("labels.json 顶层必须是对象");state.labels=value;currentFile()&&(currentFile().labels=value)}renderFiles();setStatus(`${file.name} 已加载`)}catch(error){setStatus(error.message,true)}}
    function currentFile(){return state.files[state.current]}
    function enabledGroups(){return state.groups.filter(g=>g.enabled)}
    function normalizeOcrItems(items){return (Array.isArray(items)?items:[]).filter(item=>item&&item.box).map((item,index)=>({id:String(item.id||`box_${String(index+1).padStart(3,"0")}`),bbox:item.bbox||item.box,box:item.box,polygon:item.polygon,text:String(item.text||"")}))}
    async function requestAutoOcr(item,imageData){const lang=$("ocrLang").value,mode=$("ocrMode").value;setStatus(`正在自动 OCR：${item.file.name} · ${lang} · ${mode}…`);const response=await fetch(`${$("serviceUrl").value.replace(/\/$/,"")}/ocr`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image:imageData,lang,mode,debug:false,return_cleaned_image:false})});const payload=await response.json();if(!response.ok)throw Error(payload.detail||`OCR HTTP ${response.status}`);const ocr=normalizeOcrItems(payload.items);if(!ocr.length)throw Error(`${item.file.name} 自动 OCR 没有识别到文本框`);item.ocr=ocr;item.ocrSource=`auto ${lang}/${mode}`;renderFiles();return ocr}
    async function run(groups=enabledGroups(),force=false,files=[currentFile()].filter(Boolean)){if(state.running)return;if(!files.length)return setStatus("请先加载图片",true);if(!groups.length)return setStatus("请启用至少一个参数组",true);state.running=true;toggleRun(true);try{for(const item of files){const existing=state.results.get(item.key)||new Map();state.results.set(item.key,existing);const pending=groups.filter(g=>force||!existing.has(g.id));if(!pending.length)continue;const imageData=await dataUrl(item.file);let ocr=item.ocr||state.ocr;if(!ocr?.length)ocr=await requestAutoOcr(item,imageData);setStatus(`运行背景判定：${item.file.name} · ${pending.length} 组参数…`);const labels=Object.keys(item.labels||{}).length?item.labels:state.labels;const response=await fetch(`${$("serviceUrl").value.replace(/\/$/,"")}/debug-background`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image:imageData,ocr,labels,parameterGroups:pending.map(g=>({id:g.id,params:g.params}))})});const payload=await response.json();if(!response.ok)throw Error(payload.detail||`HTTP ${response.status}`);payload.groups.forEach(result=>existing.set(result.id,result));state.activeGroup=state.activeGroup||payload.groups[0]?.id||"";state.history.unshift({time:new Date().toLocaleString(),file:item.file.name,ocrSource:item.ocrSource||"JSON",groups:payload.groups.map(g=>({id:g.id,summary:g.summary}))})}setStatus("OCR 与背景判定完成");renderResults();renderHistory()}catch(error){setStatus(error.message||String(error),true)}finally{state.running=false;toggleRun(false)}}
    function toggleRun(value){$("runPending").disabled=value;$("runAll").disabled=value}
    function renderResults(){const item=currentFile(),root=$("comparisonGrid");root.innerHTML="";const entries=item?state.results.get(item.key):null;const groups=enabledGroups();if(!item||!entries?.size){root.style.gridTemplateColumns="1fr";root.innerHTML='<div class="empty">运行参数组后在这里横向比较结果</div>';renderDetail();renderMismatch();return}root.style.gridTemplateColumns=`repeat(${groups.length},minmax(290px,1fr))`;groups.forEach((group,index)=>{const result=entries.get(group.id);const card=document.createElement("article");card.className=`result-card${state.activeGroup===group.id?" active":""}`;const head=document.createElement("div");head.className="result-head";const title=document.createElement("div");const strong=document.createElement("strong");strong.textContent=`#${index+1}`;const small=document.createElement("small");small.textContent=shortParams(group.params);title.append(strong,small);const rerun=document.createElement("button");rerun.textContent="rerun";rerun.onclick=()=>run([group],true);head.append(title,rerun);const metrics=document.createElement("div");metrics.className="metrics";const s=result?.summary||{};[["total","total"],["solid","solid"],["complex","complex"],["falseComplex","false complex"],["boundary","boundary"]].forEach(([key,label])=>{const span=document.createElement("span");const b=document.createElement("b");b.textContent=s[key]??0;span.append(b,label);metrics.append(span)});const shell=document.createElement("div");shell.className="canvas-shell";if(result){const canvas=document.createElement("canvas");canvas.dataset.group=group.id;shell.append(canvas);drawCanvas(canvas,item.image,result);card.onclick=()=>{state.activeGroup=group.id;renderResults()}}else shell.innerHTML='<div class="empty">Not run yet</div>';const legend=document.createElement("div");legend.className="legend";legend.innerHTML='<i class="dot" style="background:#16a34a"></i>solid<i class="dot" style="background:#dc2626"></i>complex<i class="dot" style="background:#eab308"></i>不一致<i class="dot" style="background:#2563eb"></i>边界<i class="dot" style="background:#7c3aed"></i>选中';card.append(head,metrics,shell,legend);root.append(card)});renderDetail();renderMismatch();updateJson()}
    function visible(box){return state.filter==="all"||state.filter===box.prediction||state.filter==="mismatch"&&box.isMismatch||state.filter==="falseComplex"&&box.label==="solid"&&box.prediction==="complex"||state.filter==="boundary"&&box.isBoundary}
    function drawCanvas(canvas,image,result){canvas.width=image.width;canvas.height=image.height;const ctx=canvas.getContext("2d");ctx.drawImage(image,0,0);ctx.lineWidth=Math.max(2,image.width/500);result.boxes.filter(visible).forEach(box=>{const [x,y,w,h]=box.bbox;let color=box.prediction==="solid"?"#16a34a":"#dc2626";if(box.isMismatch)color="#eab308";if(box.isBoundary)color="#2563eb";if(box.id===state.selectedBox)color="#7c3aed";ctx.strokeStyle=color;ctx.strokeRect(x,y,w,h)});canvas.onclick=event=>{event.stopPropagation();const rect=canvas.getBoundingClientRect(),x=(event.clientX-rect.left)*canvas.width/rect.width,y=(event.clientY-rect.top)*canvas.height/rect.height;const hit=[...result.boxes].reverse().find(b=>{const [l,t,w,h]=b.bbox;return x>=l&&x<=l+w&&y>=t&&y<=t+h});if(hit){state.activeGroup=result.id;state.selectedBox=hit.id;renderResults()}};canvas.onmousemove=event=>{const rect=canvas.getBoundingClientRect(),x=(event.clientX-rect.left)*canvas.width/rect.width,y=(event.clientY-rect.top)*canvas.height/rect.height;const hit=result.boxes.find(b=>{const [l,t,w,h]=b.bbox;return x>=l&&x<=l+w&&y>=t&&y<=t+h});canvas.title=hit?`${hit.id} · ${hit.text} · ${hit.prediction}`:""}}
    function activeResult(){return state.results.get(currentFile()?.key)?.get(state.activeGroup)} function selected(){return activeResult()?.boxes.find(b=>b.id===state.selectedBox)}
    function renderDetail(){const root=$("detail"),box=selected();root.innerHTML="";if(!box){root.className="empty";root.textContent="点击任一结果画布中的 OCR 框";return}root.className="";const summary=document.createElement("div");summary.innerHTML=`<b>${escapeHtml(box.id)}</b> · ${escapeHtml(box.prediction)} · label ${escapeHtml(box.label||"-")} · 主色 <i class="swatch" style="background:rgb(${box.colors.main_rgb.join(",")})"></i><br><span class="muted">${escapeHtml(box.text)} · ${escapeHtml(box.failReasons.join("；")||"全部指标通过")}</span>`;const grid=document.createElement("div");grid.className="preview-grid";[["crop","原始 crop"],["sampling_overlay","near / far sampling"],["mask","text mask"],["current_preview","当前算法效果"],["solid_preview","强制 solid"],["inpaint_preview","强制 TELEA"]].forEach(([key,label])=>{const cell=document.createElement("div");cell.className="preview";const b=document.createElement("b");b.textContent=label;const img=document.createElement("img");img.src=box.images[key];cell.append(b,img);grid.append(cell)});const table=document.createElement("table");const head=document.createElement("tr");head.innerHTML="<th>指标</th><th>值</th><th>阈值</th><th>结果</th>";table.append(head);Object.entries(box.metrics).forEach(([name,m])=>{const row=document.createElement("tr");row.className=m.pass?"pass":"fail";[name,m.value,`${m.mode==="max"?"≤":"≥"} ${m.threshold}`,m.pass?"PASS":"FAIL"].forEach(value=>{const td=document.createElement("td");td.textContent=value;row.append(td)});table.append(row)});root.append(summary,grid,table)}
    function renderMismatch(){const root=$("mismatchList"),result=activeResult();root.innerHTML="";const cases=result?.boxes.filter(b=>b.label==="solid"&&b.prediction==="complex")||[];if(!cases.length){root.innerHTML='<div class="empty">暂无带 solid 标签的误判样本</div>';return}cases.forEach(box=>{const button=document.createElement("button");button.className="mismatch";const img=document.createElement("img");img.src=box.images.crop;const meta=document.createElement("div");const strong=document.createElement("strong");strong.textContent=box.id;const reason=document.createElement("small");reason.textContent=box.failReasons.join("；");const closest=document.createElement("small");closest.textContent=`最接近通过：${closestMetric(box)}`;meta.append(strong,reason,closest);button.append(img,meta);button.onclick=()=>{state.selectedBox=box.id;renderResults()};root.append(button)})}
    function closestMetric(box){const failed=Object.entries(box.metrics).filter(([,m])=>!m.pass);if(!failed.length)return "-";failed.sort((a,b)=>distance(a[1])-distance(b[1]));return `${failed[0][0]} (${failed[0][1].value}/${failed[0][1].threshold})`} function distance(m){return Math.abs(m.value-m.threshold)/Math.max(.0001,Math.abs(m.threshold))}
    function renderHistory(){const root=$("history");root.innerHTML="";state.history.forEach(run=>{const p=document.createElement("p");p.textContent=`${run.time} · ${run.file} · ${run.ocrSource||"JSON"} · ${run.groups.length} groups`;root.append(p)})}
    function updateJson(){const result=activeResult();$("jsonView").textContent=JSON.stringify(result||{},null,2)}
    function shortParams(p){return `near ${p.near_expand_ratio} · far ${p.far_expand_ratio} · var ${p.lab_var_threshold} · ΔE ${p.delta_e_threshold} · dom ${p.dominant_ratio_threshold}${p.near_priority?" · near first":""}`}
    function download(value,name,type="application/json"){const blob=value instanceof Blob?value:new Blob([value],{type});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),0)}
    function exportCanvas(){const canvas=document.querySelector(`[data-group="${state.activeGroup}"]`);if(canvas)canvas.toBlob(blob=>blob&&download(blob,"background-decisions.png","image/png"))}
    async function copy(text){try{await navigator.clipboard.writeText(text)}catch{const t=document.createElement("textarea");t.value=text;document.body.append(t);t.select();document.execCommand("copy");t.remove()}setStatus("已复制到剪贴板")}
    function setStatus(text,bad=false){$("status").textContent=text;$("status").classList.toggle("bad",bad)}
    function dataUrl(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(file)})} function imageFrom(url){return new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=url})}
    function escapeHtml(value){return String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
    function bindFileInput(inputId,handler){const input=$(inputId);input.onchange=async()=>{try{await handler(input.files)}finally{input.value=""}}}
    bindFileInput("imageInput",loadImages);bindFileInput("folderInput",loadImages);bindFileInput("ocrInput",files=>files[0]&&loadJson(files[0],"ocr"));bindFileInput("labelsInput",files=>files[0]&&loadJson(files[0],"labels"));$("addGroup").onclick=addGroup;$("runPending").onclick=()=>run();$("runAll").onclick=()=>run(enabledGroups(),false,state.files);
    function resetAutoOcr(){state.files.forEach(item=>{if(item.ocrSource?.startsWith("auto ")){item.ocr=null;item.ocrSource="";state.results.delete(item.key)}});state.activeGroup="";state.selectedBox="";renderFiles();renderResults();setStatus("自动 OCR 配置已改变；下次运行会重新识别")}
    $("ocrLang").onchange=resetAutoOcr;$("ocrMode").onchange=resetAutoOcr;
    document.querySelectorAll(".filter").forEach(button=>button.onclick=()=>{document.querySelectorAll(".filter").forEach(b=>b.classList.remove("active"));button.classList.add("active");state.filter=button.dataset.filter;renderResults()});
    $("exportJson").onclick=()=>download(JSON.stringify(activeResult()||{},null,2),"background-active.json");$("exportPng").onclick=exportCanvas;$("exportDecisions").onclick=()=>download(JSON.stringify((activeResult()?.boxes||[]).map(({images,...box})=>box),null,2),"decisions.json");$("exportFalse").onclick=()=>download(JSON.stringify((activeResult()?.boxes||[]).filter(b=>b.label==="solid"&&b.prediction==="complex"),null,2),"false_complex_cases.json");$("copyParams").onclick=()=>copy(JSON.stringify(state.groups.find(g=>g.id===state.activeGroup)?.params||{},null,2));$("copyMismatch").onclick=()=>copy(JSON.stringify((activeResult()?.boxes||[]).filter(b=>b.isMismatch).map(b=>({id:b.id,label:b.label,prediction:b.prediction,failReasons:b.failReasons})),null,2));
    window.addEventListener("dragover",e=>{if([...e.dataTransfer.types].includes("Files")){e.preventDefault();document.body.classList.add("dragging")}});window.addEventListener("dragleave",()=>document.body.classList.remove("dragging"));window.addEventListener("drop",e=>{e.preventDefault();document.body.classList.remove("dragging");loadImages(e.dataTransfer.files)});window.addEventListener("beforeunload",()=>state.files.forEach(f=>URL.revokeObjectURL(f.url)));
    renderGroups();renderFiles();renderResults();
    window.__backgroundWorkbench={state,DEFAULTS,visible,closestMetric,shortParams};
  })();
  </script>
