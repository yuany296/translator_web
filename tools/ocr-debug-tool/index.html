          card.setAttribute("aria-pressed", String(isSelected));
          if (selectable) {
            card.setAttribute("role", "button");
            card.tabIndex = 0;
          }
          card.onclick = () => {
            if (!selectable) return;
            state.activeFilterGroupBySource.set(sourceKey, group.id);
            renderFilterComparison();
            updateActiveJson();
          };
          card.onkeydown = (event) => {
            if (!selectable || (event.key !== "Enter" && event.key !== " ")) return;
            event.preventDefault();
            state.activeFilterGroupBySource.set(sourceKey, group.id);
            renderFilterComparison();
            updateActiveJson();
          };
          const head = document.createElement("div");
          head.className = "result-head";
          const title = document.createElement("div");
          title.className = "result-title";
          const titleStrong = document.createElement("strong");
          titleStrong.textContent = `#${filterGroupOrdinal(group.id)}`;
          const titleParams = document.createElement("small");
          titleParams.textContent = compactFilterLabel(group.params);
          title.append(titleStrong, titleParams);
          const bestButton = document.createElement("button");
          bestButton.type = "button";
          bestButton.disabled = entry.status !== "done";
          bestButton.className = isBest ? "best" : "";
          bestButton.textContent = isBest ? "Best" : "Set best";
          bestButton.onclick = (event) => {
            event.stopPropagation();
            markBestCombination(file, source.groupId, group.id);
          };
          head.append(title, bestButton);
          const status = document.createElement("div");
          status.className = `result-status ${entry.status}`;
          status.textContent = filterResultStatusText(entry);
          const metrics = document.createElement("div");
          metrics.className = "card-metrics";
          const counts = result?.counts || {};
          metrics.innerHTML = `<span><strong>${counts.raw ?? 0}</strong>raw</span><span><strong>${counts.filtered ?? 0}</strong>kept</span><span><strong>${counts.merged ?? 0}</strong>merged</span><span><strong>${counts.overflow ?? 0}</strong>overflow</span>`;
          const shell = document.createElement("div");
          shell.className = "canvas-shell";
          if (result) {
            const canvas = document.createElement("canvas");
            canvas.dataset.filterCanvas = `${source.groupId}:${group.id}`;
            shell.appendChild(canvas);
            drawResultCanvas(canvas, result);
          } else {
            const placeholder = document.createElement("div");
            placeholder.className = "canvas-placeholder";
            placeholder.textContent = entry.status === "error" ? "Filtering failed" : entry.status === "running" ? "Applying filters…" : entry.status === "queued" ? "Waiting to filter…" : "Not applied yet";
            shell.appendChild(placeholder);
          }
          card.append(head, status, metrics, shell);
          grid.appendChild(card);
        }
      }

      function compactFilterLabel(params) {
        return `conf ${params.confidenceThreshold} · min ${params.minBoxArea} · max ${params.maxBoxArea} · aspect ${params.maxAspectRatio} · gap ${params.mergeLineGap} · font ${params.fontScale}`;
      }

      function filterResultStatusText(entry) {
        if (entry.status === "queued") return "Queued";
        if (entry.status === "running") return "Applying filters…";
        if (entry.status === "error") return `Failed: ${entry.error || "Unknown error"}`;
        if (entry.status === "done") return `Complete · ${entry.result.filterRunId}`;
        return "Ready to apply";
      }

      function compactParamLabel(params) {
        return `det ${params.textDetThresh} · box ${params.textDetBoxThresh} · unclip ${params.textDetUnclipRatio} · rec ${params.textRecScoreThresh}`;
      }

      function resultStatusText(entry) {
        if (entry.status === "queued") return "Queued";
        if (entry.status === "running") return "Running OCR…";
        if (entry.status === "error") return `Failed: ${entry.error || "Unknown error"}`;
        if (entry.status === "done") {
          const supplemented = entry.result.supplementCount ? ` · +${entry.result.supplementCount} enhanced` : "";
          return `Complete · ${entry.result.runId}${supplemented}`;
        }
        return "Ready to run";
      }

      function drawResultCanvas(canvas, result) {
        const image = result.image;
        canvas.width = image.width;
        canvas.height = image.height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(image, 0, 0);
        const stageItems = state.stage === "raw" ? result.rawItems : state.stage === "filtered" ? result.filteredItems : state.stage === "merged" ? result.mergedItems : result.finalBubbles;
        if (state.stage === "final") drawOverwrite(ctx, result.finalBubbles, $("previewMode").value);
        drawBoxes(ctx, stageItems, state.stage);
      }

      function drawBoxes(ctx, items, stage) {
        ctx.save();
        ctx.lineWidth = 3;
        ctx.font = "16px Segoe UI";
        const color = stage === "raw" ? "#ef4444" : stage === "filtered" ? "#2563eb" : stage === "merged" ? "#f59e0b" : "#059669";
        items.forEach((item, index) => {
          const box = item.box;
          if (!box) return;
          ctx.strokeStyle = color;
          ctx.fillStyle = "rgba(255,255,255,0.88)";
          ctx.strokeRect(box.left, box.top, box.width, box.height);
          const label = `${index + 1} ${(item.confidence || 0).toFixed(2)} ${item.text || item.sourceText || ""}`.slice(0, 80);
          ctx.fillRect(box.left, Math.max(0, box.top - 22), Math.min(460, label.length * 8 + 10), 22);
          ctx.fillStyle = color;
          ctx.fillText(label, box.left + 4, Math.max(15, box.top - 6));
        });
        ctx.restore();
      }

      function drawOverwrite(ctx, bubbles, mode) {
        bubbles.forEach((bubble) => {
          const box = bubble.box;
          if (mode !== "text") {
            ctx.fillStyle = "rgba(255,255,255,0.94)";
            roundRect(ctx, box.left, box.top, box.width, box.height, Math.min(8, box.height * 0.12));
            ctx.fill();
          }
          if (mode !== "cover") {
            ctx.fillStyle = "#111827";
            ctx.font = `700 ${bubble.fontSize}px "Microsoft YaHei", sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            const lineHeight = bubble.fontSize * 1.22;
            const startY = box.top + box.height / 2 - ((bubble.lines.length - 1) * lineHeight) / 2;
            bubble.lines.forEach((line, index) => ctx.fillText(line, box.left + box.width / 2, startY + index * lineHeight));
          }
        });
      }

      function roundRect(ctx, x, y, width, height, radius) {
        const r = Math.max(0, Math.min(radius, width / 2, height / 2));
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + width - r, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + r);
        ctx.lineTo(x + width, y + height - r);
        ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
        ctx.lineTo(x + r, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      function updateActiveJson() {
        const result = getActiveResult();
        $("jsonView").textContent = JSON.stringify(result ? sanitizeForJson(result) : {}, null, 2);
      }

      function getActiveResult() {
        const file = state.files[state.currentIndex];
        if (!file) return null;
        const key = fileKey(file);
        const entries = state.resultsByFile.get(key);
        if (!entries) return null;
        const enabledIds = new Set(selectedParameterGroups().map((group) => group.id));
        const activeGroupId = state.activeOcrGroupByFile.get(key);
        if (enabledIds.has(activeGroupId)) {
          const filterGroupId = state.activeFilterGroupBySource.get(filterSourceKey(key, activeGroupId));
          const filtered = filterGroupId ? state.filterResultsByFile.get(key)?.get(activeGroupId)?.get(filterGroupId)?.result : null;
          if (filtered) return filtered;
          if (entries.get(activeGroupId)?.result) return entries.get(activeGroupId).result;
        }
        for (const group of selectedParameterGroups()) {
          if (entries.get(group.id)?.result) return entries.get(group.id).result;
        }
        return null;
      }

      function sanitizeForJson(result) {
        const { image, rawPayload, dataUrl, groupId, ...rest } = result;
        return {
          ...rest,
          serviceDiagnostics: rawPayload ? {
            counts: rawPayload.counts || {},
            rawItems: rawPayload.rawItems || [],
            supplementCounts: rawPayload.supplementCounts || {},
            supplementRawItems: rawPayload.supplementRawItems || []
          } : {}
        };
      }

      function pickOcrParams(params) {
        return {
          textDetThresh: Number(params.textDetThresh),
          textDetBoxThresh: Number(params.textDetBoxThresh),
          textDetUnclipRatio: Number(params.textDetUnclipRatio),
          textRecScoreThresh: Number(params.textRecScoreThresh)
        };
      }


      function buildRunId(params) {
        state.runSeq += 1;
        const time = new Date();
        const hh = String(time.getHours()).padStart(2, "0");
        const mm = String(time.getMinutes()).padStart(2, "0");
        const ss = String(time.getSeconds()).padStart(2, "0");
        return `run-${String(state.runSeq).padStart(3, "0")}-${hh}${mm}${ss}-${ocrParamSlug(params)}`;
      }

      function buildFilterRunId(params) {
        state.filterRunSeq += 1;
        return `filter-${String(state.filterRunSeq).padStart(3, "0")}-${filterParamSlug(params)}`;
      }

      function buildSupplementRunId() {
        state.supplementRunSeq += 1;
        return `enhance-${String(state.supplementRunSeq).padStart(3, "0")}-${Date.now()}`;
      }

      function buildOcrParamLabel(params) {
        return `det=${params.textDetThresh} box=${params.textDetBoxThresh} unclip=${params.textDetUnclipRatio} rec=${params.textRecScoreThresh}`;
      }

      function buildCombinedParamLabel(params) {
        return `det=${params.textDetThresh} box=${params.textDetBoxThresh} unclip=${params.textDetUnclipRatio} rec=${params.textRecScoreThresh} | conf=${params.confidenceThreshold} minA=${params.minBoxArea} maxA=${params.maxBoxArea} asp=${params.maxAspectRatio} gap=${params.mergeLineGap} fs=${params.fontScale}`;
      }

      function ocrParamSlug(params) {
        return `d${params.textDetThresh}_b${params.textDetBoxThresh}_u${params.textDetUnclipRatio}_r${params.textRecScoreThresh}`
          .replace(/[^a-z0-9_.-]+/gi, "-")
          .slice(0, 96);
      }

      function filterParamSlug(params) {
        return `c${params.confidenceThreshold}_a${params.minBoxArea}_m${params.maxBoxArea}_x${params.maxAspectRatio}_g${params.mergeLineGap}_f${params.fontScale}`
          .replace(/[^a-z0-9_.-]+/gi, "-")
          .slice(0, 96);
      }

      function readFileAsDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result || ""));
          reader.onerror = () => reject(reader.error || new Error("read failed"));
          reader.readAsDataURL(file);
        });
      }

      function loadImage(dataUrl) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = () => reject(new Error("image decode failed"));
          image.src = dataUrl;
        });
      }

      function isSymbolOnly(text) {
        return !/[0-9A-Za-z\u3040-\u30ff\u3400-\u9fff\uac00-\ud7af]/.test(String(text || ""));
      }

      function scriptChars(text) {
        return (String(text || "").match(/[\u3040-\u30ff\u3400-\u9fff\uac00-\ud7af]/g) || []).length;
      }

      function fileKey(file) {
        return `${file.webkitRelativePath || file.name}:${file.size}:${file.lastModified}`;
      }

      function setStatus(text, error = false) {
        $("status").textContent = text;
        $("status").classList.toggle("bad", error);
      }

      function downloadCurrentJson() {
        const file = state.files[state.currentIndex];
        const result = getActiveResult();
        if (!file || !result) {
          setStatus("No active result to export.", true);
          return;
        }
        downloadText(JSON.stringify(sanitizeForJson(result), null, 2), `${stripExt(file.name)}-${result.runId || "run"}.ocr-debug.json`, "application/json");
      }

      function downloadText(text, name, type) {
        const blob = new Blob([text], { type });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = name;
        a.click();
        URL.revokeObjectURL(url);
      }

      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text);
          return;
        } catch {
          const node = document.createElement("textarea");
          node.value = text;
          node.style.position = "fixed";
          node.style.left = "-9999px";
          document.body.appendChild(node);
          node.select();
          document.execCommand("copy");
          node.remove();
        }
      }

      function downloadActivePng() {
        const file = state.files[state.currentIndex];
        const result = getActiveResult();
        if (!file || !result) {
          setStatus("No active result to export.", true);
          return;
        }
        const key = fileKey(file);
        const activeGroupId = state.activeOcrGroupByFile.get(key) || result.groupId;
        const activeFilterId = state.activeFilterGroupBySource.get(filterSourceKey(key, activeGroupId));
        const canvas = activeFilterId
          ? document.querySelector(`[data-filter-canvas="${activeGroupId}:${activeFilterId}"]`)
          : document.querySelector(`[data-group-canvas="${activeGroupId}"]`);
        if (!canvas) {
          setStatus("Active preview is not visible.", true);
          return;
        }
        const a = document.createElement("a");
        a.href = canvas.toDataURL("image/png");
        a.download = `${stripExt(file.name)}-${result.runId || "run"}-${state.stage}.png`;
        a.click();
      }

      function stripExt(name) {
        return String(name || "image").replace(/\.[^.]+$/, "");
      }

      window.addEventListener("beforeunload", () => state.previewUrls.forEach((url) => URL.revokeObjectURL(url)));
      saveParameterGroups();
      saveFilterGroups();
      renderParameterGroups();
      renderFilterGroups();
      renderRunHistory();
      renderComparison();
    </script>
  </body>
</html>
